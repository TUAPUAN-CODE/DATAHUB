# Quick full stack: SQL Server 2022 + DataSheet Pro (API + client on :4000)
#   export JWT_SECRET=$(node -e "console.log(require('crypto').randomBytes(48).toString('hex'))")
#   docker compose up -d --build
#   docker compose exec app node dist/scripts/initDb.js
#   docker compose exec app node dist/scripts/seed.js
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-YourStrong!Passw0rd}"
      MSSQL_COLLATION: Thai_CI_AS
      TZ: Asia/Bangkok
    ports: ["1433:1433"]
    volumes: [mssql:/var/opt/mssql]
    restart: unless-stopped
  app:
    build: .
    depends_on: [db]
    environment:
      DB_HOST: db
      DB_USER: sa
      DB_PASSWORD: "${DB_PASSWORD:-YourStrong!Passw0rd}"
      DB_NAME: DataSheetPro
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET (32+ chars)}"
      CORS_ORIGIN: "${PUBLIC_URL:-http://localhost:4000}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-Admin@123}"
    ports: ["4000:4000"]
    volumes: [uploads:/app/uploads]
    restart: unless-stopped
volumes:
  mssql: {}
  uploads: {}
