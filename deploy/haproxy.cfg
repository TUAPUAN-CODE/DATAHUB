# Alternative to nginx (Linux): HAProxy checks /api/health every 2 s and takes a server out of the rotation by itself.
global
    log stdout format raw local0
defaults
    mode http
    timeout connect 3s
    timeout client  120s
    timeout server  120s
    timeout tunnel  3600s          # WebSocket (Socket.IO)
    option forwardfor
    option http-server-close

frontend dochub_in
    bind *:80
    default_backend dochub_app

backend dochub_app
    balance leastconn
    option httpchk GET /api/health
    http-check expect status 200
    cookie SRV insert indirect nocache      # sticky per browser (Socket.IO polling fallback)
    server app116 172.48.0.116:4000 check inter 2s fall 2 rise 2 cookie a116
    server app115 172.48.0.115:4000 check inter 2s fall 2 rise 2 cookie a115
