# DataSheet Pro behind nginx — spreads requests over both servers and keeps working if one is down.
# Put this in the http { } block (or include it). Replace the two server lines if the addresses change.

upstream dochub_app {
    ip_hash;                                   # the same person keeps the same server (Socket.IO polling fallback needs it)
    server 172.48.0.116:4000 max_fails=2 fail_timeout=10s;
    server 172.48.0.115:4000 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;                                 # for HTTPS (needed by the phone camera): listen 443 ssl; ssl_certificate ...; ssl_certificate_key ...;
    server_name _;
    client_max_body_size 30m;                  # photos from phones (UPLOAD limit of the app is MAX_UPLOAD_MB)

    # real-time (Socket.IO)
    location /socket.io/ {
        proxy_pass http://dochub_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://dochub_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # a server that is down / answers 502-504: try the other one (GET/HEAD only — a POST is never repeated, so nothing is saved twice)
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
    }
}
